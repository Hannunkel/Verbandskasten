<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbandskasten-Kontrolle</title>
<meta name="description" content="Verbandskästen prüfen: Inhalt, Haltbarkeit, Nachbestellung per E-Mail.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C221B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verbandskasten">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C221B; --ink-2:#2C3F38; --muted:#6E837A;
  --paper:#EAEFEA; --card:#FFFFFF; --line:#DCE3DD; --line-2:#EDF1EC;
  --signal:#00814A; --signal-dk:#006036; --signal-bg:#E4F2EA;
  --amber:#A66200; --amber-bg:#FBEEDC;
  --red:#B3261E; --red-bg:#FBE7E5;
  --r:14px; --sp:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --disp:"Barlow Condensed",-apple-system,"Helvetica Neue",sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + var(--safe-b));
}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--sp) 12px;
  display:flex;align-items:center;gap:12px;
}
.topbar .eyebrow{color:#7FB8A0}
.topbar h1{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.topbar .grow{flex:1;min-width:0}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);flex:none}
.iconbtn:active{background:rgba(255,255,255,.22)}
.iconbtn[hidden]{display:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.wrap{max-width:640px;margin:0 auto;padding:var(--sp)}
.view{display:none}
.view.active{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:12px}
.sectionlabel{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.sectionlabel:first-child{margin-top:4px}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);}
.boxcard{display:flex;gap:14px;padding:14px;width:100%;text-align:left;align-items:center}
.boxcard:active{background:var(--line-2)}
.boxcard .meta{flex:1;min-width:0}
.boxcard h3{font-family:var(--disp);font-size:21px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxcard .sub{font-size:13px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chevron{color:var(--muted);flex:none}

/* Signature: Prüfplakette */
.plakette{flex:none;width:64px;height:64px}
.plakette text{font-family:var(--disp);font-weight:700}

.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--signal);border-radius:99px;transition:width .3s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--line-2);color:var(--ink-2)}
.tag.ok{background:var(--signal-bg);color:var(--signal-dk)}
.tag.warn{background:var(--amber-bg);color:var(--amber)}
.tag.bad{background:var(--red-bg);color:var(--red)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;font-weight:600;font-size:15px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);width:100%}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:10px}

/* ---------- Suche ---------- */
.search{position:relative;margin-bottom:4px}
.search input{width:100%;padding:13px 42px 13px 42px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search button{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;color:var(--muted);font-size:20px;line-height:1}
#boxList .boxcard{margin-bottom:10px}
#boxList .sectionlabel{margin:20px 0 8px}
#boxList .sectionlabel:first-child{margin-top:4px}

/* ---------- Filter chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- Artikelzeile ---------- */
.item{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item+.item{margin-top:8px}
.item .band{width:5px;flex:none;background:var(--line)}
.item.s-ok .band{background:var(--signal)}
.item.s-soon .band{background:var(--amber)}
.item.s-low .band, .item.s-expired .band, .item.s-missing .band{background:var(--red)}
.item.s-nomhd .band{background:#B9C7BF}
.reason.muted{color:var(--muted)}
.item.s-open .band{background:var(--line);
  background-image:repeating-linear-gradient(135deg,var(--line) 0 4px,#fff 4px 8px)}
.item .body{flex:1;min-width:0;padding:11px 12px}
.item h4{font-size:15px;font-weight:600;line-height:1.3}
.item .art{font-family:var(--disp);letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.itemctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{width:38px;height:38px;font-size:20px;font-weight:600;color:var(--ink-2);display:grid;place-items:center}
.stepper button:active{background:var(--line-2)}
.stepper .val{min-width:56px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.stepper .val small{font-weight:500;color:var(--muted)}
.mhd{display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
.mhd label{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:600;color:var(--muted)}
.mhd input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.mhd input:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.reason{font-size:12.5px;font-weight:600;margin-top:8px}
.reason.bad{color:var(--red)} .reason.warn{color:var(--amber)} .reason.ok{color:var(--signal-dk)}

/* ---------- Bestellung ---------- */
.orderrow{display:flex;align-items:center;gap:12px;padding:12px}
.orderrow+.orderrow{border-top:1px solid var(--line-2)}
.orderrow .meta{flex:1;min-width:0}
.orderrow h4{font-size:15px;font-weight:600}
.orderrow .art{font-family:var(--disp);letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.qty{width:64px;padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cbx{width:24px;height:24px;flex:none;accent-color:var(--signal)}
pre.preview{background:var(--ink);color:#D9E7E0;padding:14px;border-radius:var(--r);overflow-x:auto;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace}

/* ---------- Actionbar ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(234,239,234,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:10px var(--sp) calc(10px + var(--safe-b));}
.actionbar .inner{max-width:640px;margin:0 auto;display:flex;gap:10px}

/* ---------- Sheet / Dialog ---------- */
dialog{border:none;padding:0;background:transparent;max-width:100%;width:100%;margin:auto auto 0}
dialog::backdrop{background:rgba(12,34,27,.45)}
.sheet{background:var(--paper);border-radius:20px 20px 0 0;padding:20px var(--sp) calc(20px + var(--safe-b));max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto}
.sheet h2{font-family:var(--disp);font-size:24px;font-weight:600;margin-bottom:4px}
.sheet .hint{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.grabber{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}

/* ---------- Empty / Hinweise ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:52px;height:52px;stroke:var(--line);fill:none;stroke-width:1.5;margin-bottom:12px}
.empty h3{font-family:var(--disp);font-size:22px;color:var(--ink);font-weight:600;margin-bottom:6px}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:#D9E7E0;border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.banner b{color:#fff}
.banner button{color:#7FB8A0;font-weight:600;flex:none}
.logrow{padding:12px;display:flex;gap:12px;align-items:baseline}
.logrow+.logrow{border-top:1px solid var(--line-2)}
.logrow .d{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.03em;flex:none}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="backBtn" hidden aria-label="Zurück">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="grow">
    <div class="eyebrow" id="topEyebrow">Erste Hilfe · Prüfung</div>
    <h1 id="topTitle">Verbandskästen</h1>
  </div>
  <button class="iconbtn" id="settingsBtn" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007.9 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2a2 2 0 110-4h.1A1.7 1.7 0 003.6 8.4a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H8a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V8a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
  </button>
</header>

<main>
  <!-- ÜBERSICHT -->
  <section id="view-boxes" class="view active"><div class="wrap" id="boxesWrap"></div></section>
  <!-- KASTEN PRÜFEN -->
  <section id="view-box" class="view"><div class="wrap" id="boxWrap"></div></section>
  <!-- BESTELLUNG -->
  <section id="view-order" class="view"><div class="wrap" id="orderWrap"></div></section>
  <!-- PROTOKOLL -->
  <section id="view-log" class="view"><div class="wrap" id="logWrap"></div></section>
</main>

<div class="actionbar" id="actionbar"><div class="inner" id="actionInner"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script>
"use strict";
/* =========================================================
   Verbandskasten-Kontrolle — Single-File PWA
   ========================================================= */

const EMAIL_DEFAULT = "verbandstest@gmail.com";

/* ---- Speicher (mit Fallback, falls localStorage gesperrt ist) ---- */
const LS = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { ok = false; }
  return {
    ok,
    get: k => ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null),
    set: (k, v) => { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } }
  };
})();
const KEY = "vkcheck.v1";

/* ---- Artikelstamm WERO: [REF, Bezeichnung, Sollmenge, kein Haltbarkeitsdatum?] ---- */
const A_BASIS = [
  ["120066","Verbandpäckchen DIN 13151-K, steril (Kompresse 6 × 8 cm)",1],
  ["120068","Verbandpäckchen DIN 13151-M, steril (Kompresse 8 × 10 cm)",3],
  ["120070","Verbandpäckchen DIN 13151-G, steril (Kompresse 10 × 12 cm)",1],
  ["130016","Verbandtuch DIN 13152-A, 60 × 80 cm, steril",1],
  ["150278","Weroplast MasterTex Mix für DIN 13157, 30 Stk/Pkg",1],
  ["150279","Weroplast MasterTex Wundschnellverbände, 12 Stk/Pkg",1],
  ["160050","Micafilmin Spulenpflaster 5 m × 2,5 cm",1],
  ["209000","Kurzanleitung Erste Hilfe, 6-sprachig",1,1],
  ["210120","Rettungsdecke gold/silber 160 × 210 cm",1],
  ["230317","Dreiecktuch (Armtragetuch) DIN 13168-D",2],
  ["230356","Nitril Einmalhandschuhe Gr. L, 4 Stk/Pkg",1],
  ["250102","Universalschere DIN 58279 – B 190, kniegebogen",1,1],
  ["260074","Einmal-Vliesstofftuch 20 × 30 cm, 5 Stk/Pkg",1],
  ["260081","Mund-Nasen-Schutz DIN EN 14683, 2 Stk/Pkg",1],
  ["51004","CoolPack Midi Sofort-Kältekompresse",1],
  ["51066","Werosalin Wund- und Hautreinigungstuch 14,2 × 16 cm",4],
  ["71005","Augenkompresse oval 6 × 8 cm, steril",2],
  ["71067","Werozell Kompresse 10 × 10 cm, steril",6],
  ["900093","Folienbeutel mit Druckverschluss 300 × 400 mm",2,1],
  ["91016","Fixierbinde DIN 61634 – FB 6 (6 cm × 4 m)",2],
  ["91018","Fixierbinde DIN 61634 – FB 8 (8 cm × 4 m)",2]
];
const A_KOFFER = [
  ["220429","Beatmungsmaske inkl. Einwegventil und Kopfband",1],
  ["31094","Werolin Wundreinigungsspray 75 ml",1]
];
const A_SIGNS = [
  ["290001","Schild: Betriebliche Erste Hilfe, 59 × 41 cm",1,1],
  ["290175","Rettungszeichen: Erste Hilfe, 200 × 200 mm",1,1]
];
const A_SMART = [
  ["150208","Werosmart MasterTex Pflasterstrips 7,2 × 2,5 cm, 40 Stk/Einsatz",1],
  ["150206","Werosmart MasterTex Fingerpflaster 12 × 2 cm, 30 Stk/Einsatz",1],
  ["180800","Smart Box Pflasterspender, leer",1,1]
];
const A_BURN = [
  ["140108","BurnAway Kompresse 10 × 10 cm",1],
  ["140103","BurnAway Kühlgel 60 ml",1]
];
const A_AUGEN = [
  ["380035","Augenspülstation QuickCheck, gefüllt (2 × Augenspülflasche P8, 1000 ml)",1],
  ["207003","Verband Set Auge",1],
  ["290126","Schild: Anwendung Augenspülflasche A8 / P8, DIN A5",1,1],
  ["290136","Rettungszeichen: Augenspüleinrichtung 200 × 200 mm",1,1],
  ["20290126","Gebotszeichen: Augenschutz benutzen, Ø 200 mm",1,1],
  ["20290144","Gebotszeichen: Handschutz benutzen, Ø 200 mm",1,1],
  ["20290167","Gebotszeichen: Schutzkleidung benutzen, Ø 200 mm",1,1]
];
const A_IV    = [["","Inhaltsverzeichnis",1,1]];
const A_DRUCK = [["120048","Druckverband steril, gebrauchsfertig (Wundauflage 10 × 10 cm)",1]];
const A_SENSI = [["150500","Weroplast SensiVlies XL Pflasterstrips Mix, 12 Stk/Pkg",1]];
const A_SBVOLL= [["150220","Smart Box Pflasterspender, gefüllt (REF 150208 + 150206)",1]];
const cat = (...a) => [].concat(...a);

const TEMPLATES = {
  koffer:    { label:"Koffer Werotop 350",              items: cat(A_BASIS, A_KOFFER, A_IV) },
  koffer_sb: { label:"Koffer + Pflasterspender",        items: cat(A_BASIS, A_KOFFER, A_SMART, A_IV) },
  schrank:   { label:"Schrank ST 200",                  items: cat(A_BASIS, A_KOFFER, A_BURN, A_IV) },
  mvvr:      { label:"Koffer mit Aushang (MVVR)",       items: cat(A_BASIS, A_SIGNS, A_IV) },
  augen:     { label:"Augenspülstation QuickCheck",     items: cat(A_AUGEN, A_IV) },
  leer:      { label:"Leer (selbst befüllen)",          items: [] }
};

/* ---- Einrichtungen laut WERO-Inhaltsverzeichnis vom 11.08.2026 ---- */
const STANDORTE = [
  { n:"Empfang",           g:"O.v.G. Str. 25", art:"Koffer + Pflasterspender", t:"koffer_sb", plus:A_SENSI },
  { n:"2. Etage",          g:"O.v.G. Str. 25", art:"Koffer Werotop 350",       t:"koffer" },
  { n:"3. Etage",          g:"O.v.G. Str. 25", art:"Koffer Werotop 350",       t:"koffer" },
  { n:"4. Etage",          g:"O.v.G. Str. 25", art:"Koffer Werotop 350",       t:"koffer" },
  { n:"5. Etage",          g:"O.v.G. Str. 25", art:"Koffer Werotop 350",       t:"koffer" },
  { n:"Pausenraum Fahrer", g:"O.v.G. Str. 25", art:"Koffer + Pflasterspender", t:"koffer_sb" },
  { n:"Teeküche Anbau",    g:"O.v.G. Str. 25", art:"Schrank ST 200",           t:"schrank" },
  { n:"Leitzentrale",      g:"O.v.G. Str. 25", art:"Schrank + Pflasterspender",t:"koffer_sb", plus:A_DRUCK },
  { n:"Teeküche Abo",      g:"O.v.G. Str. 25", art:"Koffer + Pflasterspender", t:"koffer_sb", plus:A_BURN },
  { n:"Hausmeister Flur",  g:"O.v.G. Str. 25", art:"Koffer Werotop 350",       t:"koffer" },
  { n:"Verwaltung",        g:"MVVR",           art:"Koffer Werotop 350",       t:"mvvr" },
  { n:"Aufbereitung",      g:"MVVR",           art:"Koffer Werotop 350",       t:"mvvr" },
  { n:"Aufbereitung",      g:"MVVR",           art:"Augenspülstation",         t:"augen" },
  { n:"Lager",             g:"MVVR",           art:"Koffer Werotop 350",       t:"mvvr", plus:A_SBVOLL }
];

/* ---- State ---- */
const DEF = { v:1, settings:{ email:EMAIL_DEFAULT, pruefer:"", warn:3, interval:12 }, boxes:[] };
let state = load();
let view = "boxes", curBox = null, filter = "alle", orderScope = null, orderData = [], boxQuery = "";

function load(){
  try{
    const raw = LS.get(KEY);
    if(!raw) return structuredClone(DEF);
    const p = JSON.parse(raw);
    return Object.assign(structuredClone(DEF), p, { settings: Object.assign({}, DEF.settings, p.settings||{}) });
  }catch(e){ return structuredClone(DEF); }
}
const save = () => LS.set(KEY, JSON.stringify(state));

/** Legt die Einrichtungen aus STANDORTE an. Bereits vorhandene bleiben unberührt. */
function seedStandorte(){
  let neu = 0;
  STANDORTE.forEach(sd => {
    const da = state.boxes.some(b => b.name===sd.n && b.ort===sd.g && b.art===sd.art);
    if(da) return;
    const t = TEMPLATES[sd.t].items;
    const roh = sd.plus ? cat(t.slice(0,-1), sd.plus, t.slice(-1)) : t;
    state.boxes.push({
      id:uid(), name:sd.n, ort:sd.g, art:sd.art, norm:sd.t, intervall:12,
      letztePruefung:null, letzterPruefer:"", log:[],
      items: roh.map(r => ({ id:uid(), a:r[0], n:r[1], soll:r[2], ist:0, mhd:"", x:r[3]?1:0, g:0 }))
    });
    neu++;
  });
  state.seeded = 1; save();
  return neu;
}
const uid  = () => Math.random().toString(36).slice(2,9);

/* ---- Datums-Helfer ---- */
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => { if(!iso) return "–"; const d=new Date(iso); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; };
const fmtMonth = m => m ? `${m.slice(5,7)}/${m.slice(0,4)}` : "–";
const monthsUntil = m => { // m = "YYYY-MM"; Ablauf am Monatsende
  if(!m) return null;
  const [y,mo] = m.split("-").map(Number);
  const end = new Date(y, mo, 0), now = new Date();
  return Math.round((end - now) / 2629800000);
};
function addMonths(iso, n){ const d = new Date(iso); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
const nextCheck = b => b.letztePruefung ? addMonths(b.letztePruefung, b.intervall||12) : null;

/* ---- Status-Logik ---- */
function itemStatus(it){
  if(!it.g) return "open";                       // noch nicht geprüft
  if(it.ist === 0) return "missing";             // fehlt komplett
  const mu = it.x ? null : monthsUntil(it.mhd);
  if(mu !== null && mu < 0) return "expired";    // abgelaufen
  if(it.ist < it.soll) return "low";             // Fehlmenge
  if(mu !== null && mu <= (state.settings.warn||3)) return "soon";
  if(!it.x && !it.mhd) return "nomhd";           // Menge ok, MHD fehlt
  return "ok";
}
const REASON = {
  open:["", ""], ok:["Vollständig · haltbar","ok"],
  soon:["Läuft bald ab","warn"], low:["Fehlmenge","bad"], nomhd:["Haltbarkeit noch nicht erfasst","muted"],
  expired:["Haltbarkeit abgelaufen","bad"], missing:["Fehlt komplett","bad"]
};
/** Bestellbedarf: abgelaufen ⇒ komplett ersetzen, sonst Differenz zur Sollmenge */
function need(it){
  const st = itemStatus(it);
  if(st === "expired") return it.soll;
  if(st === "low" || st === "missing") return Math.max(0, it.soll - it.ist);
  return 0;
}
function boxStats(b){
  const s = { total:b.items.length, geprueft:0, probleme:0, bestellen:0, offen:0, ablauf:0, ohneMhd:0 };
  b.items.forEach(it=>{
    const st = itemStatus(it);
    if(st === "open"){ s.offen++; return; }
    s.geprueft++;
    if(st === "soon") s.ablauf++;
    if(st === "nomhd") s.ohneMhd++;
    if(["low","expired","missing"].includes(st)){ s.probleme++; s.bestellen += need(it); }
  });
  return s;
}
function boxLevel(b){ // ok | warn | bad | neu
  const s = boxStats(b);
  if(s.probleme) return "bad";
  const due = nextCheck(b);
  if(due && new Date(due) < new Date()) return "bad";
  if(s.ablauf || s.offen || s.ohneMhd) return "warn";
  if(!b.letztePruefung) return "warn";
  return "ok";
}

/* ---- kleine DOM-Helfer ---- */
const $  = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ---- Prüfplakette (Signature-Element) ---- */
function plakette(b){
  const lvl = boxLevel(b);
  const col = { ok:"#00814A", warn:"#A66200", bad:"#B3261E", neu:"#6E837A" }[lvl];
  const due = nextCheck(b);
  const d = due ? new Date(due) : null;
  const mm = d ? d.getMonth()+1 : 0;
  const yy = d ? String(d.getFullYear()).slice(2) : "––";
  let ticks = "";
  for(let i=1;i<=12;i++){
    const a = (i-1)*30 - 90, r = Math.PI/180*a;
    const on = i === mm;
    const r1 = on ? 20 : 24, r2 = 29;
    ticks += `<line x1="${34+Math.cos(r)*r1}" y1="${34+Math.sin(r)*r1}" x2="${34+Math.cos(r)*r2}" y2="${34+Math.sin(r)*r2}"
      stroke="${on?col:"#C9D4CD"}" stroke-width="${on?4:2}" stroke-linecap="round"/>`;
  }
  return `<svg class="plakette" viewBox="0 0 68 68" role="img" aria-label="Nächste Prüfung ${d?MON[mm-1]+" "+d.getFullYear():"offen"}">
    <circle cx="34" cy="34" r="32" fill="#fff" stroke="${col}" stroke-width="2.5"/>
    ${ticks}
    <text x="34" y="32" text-anchor="middle" font-size="20" fill="${col}">${yy}</text>
    <text x="34" y="45" text-anchor="middle" font-size="11" letter-spacing="1" fill="#6E837A">${d?MON[mm-1].toUpperCase():"NEU"}</text>
  </svg>`;
}

/** Nur die Liste neu zeichnen – das Suchfeld behält so den Fokus. */
function renderBoxList(){
  const el = $("#boxList"); if(!el) return;
  const q = boxQuery.trim().toLowerCase();
  const treffer = state.boxes.filter(b => !q ||
    [b.name, b.ort, b.art, TEMPLATES[b.norm]?.label].join(" ").toLowerCase().includes(q));

  if(!treffer.length){
    el.innerHTML = `<div class="empty" style="padding:32px 20px">
      <h3>Nichts gefunden</h3><p>Suche nach Standort, Gebäude oder Art der Einrichtung.</p></div>`;
    return;
  }
  let html = "", letztes = null;
  treffer.forEach(b => {
    if(!q && b.ort !== letztes){ letztes = b.ort; html += `<div class="sectionlabel">${esc(b.ort||"Ohne Gebäude")}</div>`; }
    html += boxCard(b, !!q);
  });
  el.innerHTML = html;
  el.querySelectorAll("[data-open]").forEach(x => x.onclick = () => openBox(x.dataset.open));
}

function boxCard(b, mitGebaeude){
  const s = boxStats(b), due = nextCheck(b);
  const overdue = due && new Date(due) < new Date();
  const tags = [];
  if(s.probleme) tags.push(`<span class="tag bad">${s.probleme} ${s.probleme===1?"Position":"Positionen"} kritisch</span>`);
  if(s.ablauf)   tags.push(`<span class="tag warn">${s.ablauf}× läuft ab</span>`);
  if(s.offen)    tags.push(`<span class="tag">${s.offen} offen</span>`);
  if(s.ohneMhd)  tags.push(`<span class="tag">${s.ohneMhd}× ohne MHD</span>`);
  if(!tags.length && s.total) tags.push(`<span class="tag ok">Vollständig</span>`);
  if(overdue)    tags.push(`<span class="tag bad">Prüfung überfällig</span>`);
  const sub = mitGebaeude ? `${esc(b.ort||"")} · ${esc(b.art||TEMPLATES[b.norm]?.label||"")}`
                          : esc(b.art || TEMPLATES[b.norm]?.label || "individuell");
  return `<button class="card boxcard" data-open="${b.id}">
    ${plakette(b)}
    <div class="meta">
      <h3>${esc(b.name)}</h3>
      <div class="sub">${sub}</div>
      <div class="bar"><i style="width:${s.total?Math.round(s.geprueft/s.total*100):0}%"></i></div>
      <div class="tags">${tags.join("")}</div>
    </div>
    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>`;
}

function openBox(id){ curBox = id; filter = "alle"; go("box"); }

function itemRow(it){
  const st = itemStatus(it);
  const [txt, cls] = REASON[st];
  const mu = it.x ? null : monthsUntil(it.mhd);
  let detail = txt;
  if(st==="soon" && mu !== null) detail = `Läuft ab in ${mu===0?"unter 1 Monat":mu+" Monaten"} (${fmtMonth(it.mhd)})`;
  if(st==="expired") detail = `Abgelaufen ${fmtMonth(it.mhd)} · ${it.soll} Stk. ersetzen`;
  if(st==="low") detail = `${it.soll-it.ist} Stk. fehlen`;
  if(st==="missing") detail = `Fehlt komplett · ${it.soll} Stk. bestellen`;
  return `<div class="item s-${st}">
    <div class="band"></div>
    <div class="body">
      <h4>${esc(it.n)}</h4>
      <div class="art">${esc(it.a||"ohne Art.-Nr.")} <button data-edit="${it.id}" style="color:var(--signal-dk);font:inherit;letter-spacing:0;text-transform:none">bearbeiten</button></div>
      <div class="itemctl">
        <div class="stepper">
          <button data-inc="${it.id}" data-step="-1" aria-label="Menge verringern">−</button>
          <span class="val">${it.ist}<small>/${it.soll}</small></span>
          <button data-inc="${it.id}" data-step="1" aria-label="Menge erhöhen">+</button>
        </div>
        ${it.x ? `<div class="mhd"><label>ohne Haltbarkeit</label></div>`
               : `<div class="mhd"><label for="m-${it.id}">MHD</label><input type="month" id="m-${it.id}" data-mhd="${it.id}" value="${it.mhd||""}"></div>`}
      </div>
      ${detail?`<div class="reason ${cls}">${esc(detail)}</div>`:""}
    </div>
  </div>`;
}
function setQty(b, id, step){
  const it = b.items.find(i=>i.id===id);
  it.ist = Math.max(0, Math.min(999, (it.ist||0) + step));
  it.g = 1; save(); renderBox();
}
function finishCheck(b){
  const s = boxStats(b);
  if(s.offen){ toast(`Noch ${s.offen} Artikel ungeprüft`); filter="offen"; renderBox(); return; }
  const pruefer = state.settings.pruefer || "";
  b.letztePruefung = todayISO();
  b.letzterPruefer = pruefer;
  b.log = b.log || [];
  b.log.unshift({ d:todayISO(), p:pruefer, ok:s.probleme===0, probleme:s.probleme, bestellt:s.bestellen });
  save(); renderBox();
  toast(s.probleme ? "Prüfung dokumentiert – Bestellung offen" : "Prüfung dokumentiert · alles i.O.");
}

/* =========================================================
   VIEW 3 — Bestellung
   ========================================================= */
function openOrder(boxId){
  orderScope = boxId;
  const boxes = boxId ? state.boxes.filter(b=>b.id===boxId) : state.boxes;
  const map = new Map();
  boxes.forEach(b => b.items.forEach(it => {
    const q = need(it); if(!q) return;
    const st = itemStatus(it);
    const key = (it.a||it.n) + "|" + it.n;
    const grund = st==="expired" ? `abgelaufen ${fmtMonth(it.mhd)}` : st==="missing" ? "fehlt" : "Fehlmenge";
    if(map.has(key)){ const e = map.get(key); e.q += q; if(!e.boxes.includes(b.name)) e.boxes.push(b.name); e.gruende.add(grund); }
    else map.set(key, { a:it.a, n:it.n, q, boxes:[b.name], gruende:new Set([grund]), on:true });
  }));
  orderData = [...map.values()];
  go("order");
}

  $("#orderWrap").querySelectorAll("[data-q]").forEach(el => el.onchange = () => { orderData[+el.dataset.q].q = Math.max(1, +el.value||1); renderOrder(); });

    catch(e){ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("Bestelltext kopiert"); }
  };

    location.href = `mailto:${encodeURIComponent(state.settings.email)}?subject=${encodeURIComponent(orderSubject())}&body=${encodeURIComponent(orderBody())}`;

}
function orderSubject(){
  const scope = orderScope ? (state.boxes.find(b=>b.id===orderScope)?.name||"") : "Sammelbestellung";
  return `Bestellung Verbandmaterial – ${scope} – ${fmtDate(todayISO())}`;
}
function orderBody(){
  const sel = orderData.filter(o=>o.on);
  const b = orderScope ? state.boxes.find(x=>x.id===orderScope) : null;
  const L = [];
  L.push("Guten Tag,");
  L.push("");
  L.push("bitte liefern Sie folgendes Verbandmaterial:");
  L.push("");
  sel.forEach(o => {
    L.push(`${o.q} x  ${o.n}`);
    L.push(`      Art.-Nr.: ${o.a||"—"}   (${[...o.gruende].join(", ")})`);
  });
  L.push("");
  L.push("— — —");
  L.push(b ? `Standort: ${b.name}${b.ort?`, ${b.ort}`:""}` : `Umfang:   ${state.boxes.length} Einrichtungen (Sammelbestellung)`);
  if(b) L.push(`Einricht.: ${b.art || TEMPLATES[b.norm]?.label || "individuell"}`);
  L.push(`Geprüft:  ${fmtDate(todayISO())}${state.settings.pruefer?` von ${state.settings.pruefer}`:""}`);
  L.push("");
  L.push("Vielen Dank und freundliche Grüße");
  L.push(state.settings.pruefer || "");
  return L.join("\n");
}

/* =========================================================
   VIEW 4 — Protokoll
   ========================================================= */
function renderLog(){
  const b = state.boxes.find(x=>x.id===orderScope) || state.boxes.find(x=>x.id===curBox);
  $("#topEyebrow").textContent = "Prüfprotokoll";
  $("#topTitle").textContent = b ? b.name : "Protokoll";
  $("#backBtn").hidden = false;
  const log = (b?.log)||[];
  $("#logWrap").innerHTML = log.length ? `
    <div class="sectionlabel">${log.length} dokumentierte ${log.length===1?"Prüfung":"Prüfungen"}</div>
    <div class="card">${log.map(e=>`
      <div class="logrow">
        <span class="d num">${fmtDate(e.d)}</span>
        <span style="flex:1">
          <span class="tag ${e.ok?"ok":"bad"}">${e.ok?"i.O.":e.probleme+" Mängel"}</span>
          ${e.bestellt?`<span class="tag">${e.bestellt} bestellt</span>`:""}
          ${e.p?`<div style="font-size:13px;color:var(--muted);margin-top:4px">Prüfer: ${esc(e.p)}</div>`:""}
        </span>
      </div>`).join("")}</div>`
    : `<div class="empty"><h3>Noch keine Prüfung dokumentiert</h3><p>Schließe eine Prüfung ab, dann erscheint sie hier mit Datum und Prüfer.</p></div>`;
  $("#actionInner").innerHTML = `<button class="btn ghost" id="aBack">Zurück zum Kasten</button>`;
  $("#aBack").onclick = () => back();
}

/* =========================================================
   Sheets (Kasten / Artikel / Einstellungen)
   ========================================================= */
const sheet = $("#sheet");
function openSheet(html){ $("#sheetBody").innerHTML = `<div class="grabber"></div>` + html; sheet.showModal(); }
function closeSheet(){ sheet.close(); }
sheet.addEventListener("click", e => { if(e.target === sheet) closeSheet(); });

function sheetBox(b){
  const isNew = !b;
  openSheet(`
    <h2>${isNew?"Einrichtung anlegen":"Einrichtung bearbeiten"}</h2>
    <p class="hint">${isNew?"Der Inhalt wird aus der gewählten Vorlage übernommen und bleibt jederzeit änderbar.":"Änderungen am Inhalt nimmst du direkt in der Liste vor."}</p>
    <div class="field"><label for="fName">Standort</label>
      <input id="fName" placeholder="z. B. Leitzentrale" value="${esc(b?.name||"")}"></div>
    <div class="field"><label for="fOrt">Gebäude / Objekt</label>
      <input id="fOrt" placeholder="z. B. O.v.G. Str. 25" value="${esc(b?.ort||"")}" list="gebList">
      <datalist id="gebList">${[...new Set(state.boxes.map(x=>x.ort).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist></div>
    <div class="field"><label for="fArt">Art der Einrichtung</label>
      <input id="fArt" placeholder="z. B. Koffer Werotop 350" value="${esc(b?.art||"")}"></div>
    <div class="field"><label for="fNorm">Vorlage</label>
      <select id="fNorm" ${isNew?"":"disabled"}>
        ${Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}" ${b?.norm===k?"selected":""}>${t.label}</option>`).join("")}
      </select></div>
    <div class="field"><label for="fInt">Prüfintervall (Monate)</label>
      <input id="fInt" type="number" inputmode="numeric" min="1" max="60" value="${b?.intervall||state.settings.interval||12}"></div>
    <div class="btnrow" style="margin-top:18px">
      ${isNew?"":`<button class="btn ghost" id="fDel" style="color:var(--red);border-color:var(--red)">Löschen</button>`}
      <button class="btn primary" id="fSave">${isNew?"Anlegen":"Speichern"}</button>
    </div>`);
  $("#fSave").onclick = () => {
    const name = $("#fName").value.trim();
    if(!name){ $("#fName").focus(); toast("Bitte eine Bezeichnung eingeben"); return; }
    const intervall = Math.max(1, +$("#fInt").value || 12);
    if(isNew){
      const norm = $("#fNorm").value;
      state.boxes.push({
        id:uid(), name, ort:$("#fOrt").value.trim(), art:$("#fArt").value.trim() || TEMPLATES[norm].label, norm, intervall,
        letztePruefung:null, letzterPruefer:"", log:[],
        items: TEMPLATES[norm].items.map(r=>({ id:uid(), a:r[0], n:r[1], soll:r[2], ist:0, mhd:"", x:r[3]?1:0, g:0 }))
      });
      save(); closeSheet(); renderBoxes(); toast("Einrichtung angelegt");
    } else {
      b.name = name; b.ort = $("#fOrt").value.trim(); b.art = $("#fArt").value.trim(); b.intervall = intervall;
      save(); closeSheet(); renderBox(); toast("Gespeichert");
    }
  };
  const del = $("#fDel");
  if(del) del.onclick = () => {
    if(!confirm(`„${b.name}“ mit allen Prüfungen löschen?`)) return;
    state.boxes = state.boxes.filter(x=>x.id!==b.id);
    save(); closeSheet(); go("boxes"); toast("Einrichtung gelöscht");
  };
}

function sheetItem(b, it){
  const isNew = !it;
  openSheet(`
    <h2>${isNew?"Artikel hinzufügen":"Artikel bearbeiten"}</h2>
    <p class="hint">Artikelnummer und Bezeichnung werden 1:1 in die Bestell-E-Mail übernommen.</p>
    <div class="field"><label for="iN">Bezeichnung</label>
      <input id="iN" placeholder="z. B. Fixierbinde 8 cm × 4 m" value="${esc(it?.n||"")}"></div>
    <div class="field"><label for="iA">Artikelnummer</label>
      <input id="iA" placeholder="z. B. 1234567" value="${esc(it?.a||"")}"></div>
    <div class="field"><label for="iS">Sollmenge</label>
      <input id="iS" type="number" inputmode="numeric" min="1" max="999" value="${it?.soll||1}"></div>
    <div class="field"><label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--body);font-size:15px;color:var(--ink)">
      <input class="cbx" type="checkbox" id="iX" ${it?.x?"checked":""} style="width:22px;height:22px"> Artikel hat kein Haltbarkeitsdatum</label></div>
    <div class="btnrow" style="margin-top:18px">
      ${isNew?"":`<button class="btn ghost" id="iDel" style="color:var(--red);border-color:var(--red)">Entfernen</button>`}
      <button class="btn primary" id="iSave">${isNew?"Hinzufügen":"Speichern"}</button>
    </div>`);
  $("#iSave").onclick = () => {
    const n = $("#iN").value.trim();
    if(!n){ $("#iN").focus(); toast("Bitte eine Bezeichnung eingeben"); return; }
    const data = { n, a:$("#iA").value.trim(), soll:Math.max(1,+$("#iS").value||1), x:$("#iX").checked?1:0 };
    if(isNew) b.items.push(Object.assign({ id:uid(), ist:0, mhd:"", g:0 }, data));
    else Object.assign(it, data);
    save(); closeSheet(); renderBox(); toast(isNew?"Artikel hinzugefügt":"Gespeichert");
  };
  const d = $("#iDel");
  if(d) d.onclick = () => { b.items = b.items.filter(x=>x.id!==it.id); save(); closeSheet(); renderBox(); toast("Artikel entfernt"); };
}

function sheetSettings(){
  openSheet(`
    <h2>Einstellungen</h2>
    <p class="hint">Gilt für alle Kästen auf diesem Gerät.</p>
    <div class="field"><label for="sMail">Bestellungen senden an</label>
      <input id="sMail" type="email" inputmode="email" value="${esc(state.settings.email)}"></div>
    <div class="field"><label for="sPruefer">Name des Prüfers</label>
      <input id="sPruefer" placeholder="erscheint in Protokoll und Bestellung" value="${esc(state.settings.pruefer)}"></div>
    <div class="field"><label for="sWarn">Vorwarnzeit Haltbarkeit (Monate)</label>
      <input id="sWarn" type="number" inputmode="numeric" min="0" max="24" value="${state.settings.warn}"></div>
    <button class="btn primary" id="sSave">Speichern</button>
    <div class="sectionlabel">Standorte</div>
    <p class="hint" style="margin-bottom:10px">Legt fehlende Einrichtungen aus der hinterlegten WERO-Liste an. Vorhandene bleiben mit ihren Prüfdaten unverändert.</p>
    <button class="btn ghost" id="sSeed">Standortliste abgleichen</button>
    <div class="sectionlabel">Datensicherung</div>
    <p class="hint" style="margin-bottom:10px">Alle Daten liegen nur in diesem Browser. Vor dem Löschen der Website-Daten oder beim Gerätewechsel: Backup exportieren.</p>
    <div class="btnrow">
      <button class="btn ghost" id="sExport">Exportieren</button>
      <button class="btn ghost" id="sImport">Importieren</button>
    </div>
    <p class="note" style="margin-top:16px">Version 1.1 · Die DIN-Inhaltslisten sind Vorlagen zur Arbeitserleichterung. Maßgeblich ist die jeweils gültige Norm bzw. die Packungsbeilage des Herstellers.</p>`);
  $("#sSave").onclick = () => {
    state.settings.email = $("#sMail").value.trim() || EMAIL_DEFAULT;
    state.settings.pruefer = $("#sPruefer").value.trim();
    state.settings.warn = Math.max(0, +$("#sWarn").value||0);
    save(); closeSheet(); render(); toast("Einstellungen gespeichert");
  };
  $("#sSeed").onclick = () => {
    const n = seedStandorte();
    closeSheet(); go("boxes");
    toast(n ? `${n} Einrichtungen ergänzt` : "Alle Standorte sind bereits angelegt");
  };
  $("#sExport").onclick = () => {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `verbandskasten-backup-${todayISO()}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast("Backup gespeichert");
  };
  $("#sImport").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const p = JSON.parse(r.result);
          if(!Array.isArray(p.boxes)) throw 0;
          if(!confirm("Backup einspielen? Die aktuellen Daten auf diesem Gerät werden ersetzt.")) return;
          state = Object.assign(structuredClone(DEF), p, { settings:Object.assign({},DEF.settings,p.settings||{}) });
          save(); closeSheet(); go("boxes"); toast("Backup eingespielt");
        }catch(e){ toast("Datei nicht lesbar – bitte Backup-Datei wählen"); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
}

/* =========================================================
   Router
   ========================================================= */
function go(v){ view = v; render(); window.scrollTo({top:0}); }
function back(){
  if(view==="box") go("boxes");
  else if(view==="order") go(orderScope?"box":"boxes");
  else if(view==="log") go("box");
  else go("boxes");
}
function render(){
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "view-"+view));
  ({ boxes:renderBoxes, box:renderBox, order:renderOrder, log:renderLog })[view]();
}
$("#backBtn").onclick = back;
$("#settingsBtn").onclick = sheetSettings;

/* iOS-Hinweis „Zum Home-Bildschirm“ */
(function installHint(){
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if(standalone || !iOS || LS.get("vk.hint") === "1") return;
  const d = document.createElement("div");
  d.className = "banner";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(96px + var(--safe-b));z-index:50;box-shadow:0 8px 30px rgba(12,34,27,.25)";
  d.innerHTML = `<div style="flex:1">Als App installieren: unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.</div><button>OK</button>`;
  d.querySelector("button").onclick = () => { LS.set("vk.hint","1"); d.remove(); };
  document.body.appendChild(d);
})();

if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));

if(!state.boxes.length && !state.seeded) seedStandorte();

render();
</script>
</body>
</html>
